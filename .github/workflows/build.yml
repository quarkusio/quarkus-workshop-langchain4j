name: Build

env:
  JVM_VERSION: '21'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: "workflow = ${{ github.workflow }}, ref = ${{ github.event.ref }}, pr = ${{ github.event.pull_request.id }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - section-1/step-01
          - section-1/step-02
          - section-1/step-03
          - section-1/step-04
          - section-1/step-05
          - section-1/step-06
          - section-1/step-07
          - section-1/step-08
          - section-1/step-09
          - section-1/step-10
          - section-1/step-11
          - section-2/step-01
          - section-2/step-02
          - section-2/step-03
          - section-2/step-04
          - section-2/step-05
          - section-2/step-06
          - section-2/step-07
          - section-2/step-08/multi-agent-system
          - section-2/step-08/remote-a2a-agent
          - section-2/step-09/multi-agent-system
          - section-2/step-09/remote-a2a-agent
          - section-3/step-00
          - section-3/step-01
          - section-3/step-02
          - section-3/step-03
          - section-3/step-04
          - section-3/step-05
          - section-3/step-06/mcp-server
          - section-3/step-06/trip-planner
          - section-3/step-07/mcp-server
          - section-3/step-07/trip-planner

    name: "Build ${{ matrix.app }}"
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JVM_VERSION }}
          distribution: temurin
          cache: maven
      - name: Maven Build for ${{ matrix.app }}
        working-directory: ${{ matrix.app }}
        run: ./mvnw -B clean verify -Dquarkus.http.host=0.0.0.0 -DskipITs=false


  docs-build:
    runs-on: ubuntu-latest
    name: "Build Docs"
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history for the sitemap <lastmod> dates
          fetch-depth: 0
      - name: Test Roq Site
        working-directory: docs
        # Roq serves the test site from "/" whichever root path the build uses,
        # so the tests run before the deployable site is generated.
        run: mvn -B test
      - name: Generate Roq Site
        working-directory: docs
        # Assets need the published root path. site.url stays host-only here
        # because Roq appends the root path to it; application.properties holds
        # the full URL for local builds.
        run: >-
          mvn -B package quarkus:run -DskipTests
          -Dsite.url=https://quarkus.io
          -Dquarkus.http.root-path=/quarkus-workshop-langchain4j
        env:
          QUARKUS_ROQ_GENERATOR_BATCH: true
      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/target/roq

  docs-deploy:
    runs-on: ubuntu-latest
    name: "Deploy Docs"
    needs: docs-build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
