---
theme-layout: base
---
{#insert /}

{! The theme's head and scripts load its assets from absolute /assets paths,
   which 404 under the GitHub Pages root path; fromRoot keeps the root path. !}
{#head}
<title>{page.title.raw}</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{#bundle /}
<link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.2/css/all.css" crossorigin="anonymous">
<script src="{site.url.fromRoot('/assets/javascript/colormode.js')}" type="text/javascript"></script>
{/head}

{#scripts}
<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js" integrity="sha384-8gBf6Y4YYq7Jx97PIqmTwLPin4hxIzQw5aDmUg/DDhul9fFpbbLcLh3nTIIDJKhx" crossorigin="anonymous"></script>
<script type="text/javascript" src="{site.url.fromRoot('/assets/javascript/mobile-nav.js')}"></script>
{#search-overlay /}
{#search-script /}
{/scripts}
