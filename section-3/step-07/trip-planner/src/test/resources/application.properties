quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:test}
quarkus.langchain4j.openai.enhancedModel.api-key=${OPENAI_API_KEY:test}
quarkus.langchain4j.openai.timeout=10s

mp.messaging.outgoing.flow-out.connector=smallrye-in-memory
mp.messaging.incoming.flow-out-consumer.connector=smallrye-in-memory
mp.messaging.outgoing.flow-in-producer.connector=smallrye-in-memory
mp.messaging.incoming.flow-in.connector=smallrye-in-memory
mp.messaging.incoming.flow-in.smallrye-in-memory.run-on-vertx-context=true
mp.messaging.incoming.flow-out-consumer.smallrye-in-memory.run-on-vertx-context=true
quarkus.kafka.devservices.enabled=false
trip.planning.timeout=PT3S

# Isolated, disposable PostgreSQL; never reuse the workshop's dev database.
quarkus.datasource.devservices.reuse=false
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# The Langfuse extension requires the three keys in every mode. Base sets none
# so the live (evals) profile lets Dev Services inject the real values; the
# default test profile points them at a dead endpoint so a booting app still
# validates while every exporter call fails locally.
quarkus.langfuse.devservices.enabled=false
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=http://127.0.0.1:9/v1

%test.quarkus.langfuse.base-url=http://127.0.0.1:9
%test.quarkus.langfuse.public-key=pk-offline
%test.quarkus.langfuse.secret-key=sk-offline

# Live composition (-Pevals, @TestProfile mcp): the MCP workflow runs against
# the real Trip Intelligence server; Langfuse stays off (dead keys, no
# containers) because this IT asserts plan structure, not telemetry.
%mcp.quarkus.langfuse.base-url=http://127.0.0.1:9
%mcp.quarkus.langfuse.public-key=pk-offline
%mcp.quarkus.langfuse.secret-key=sk-offline
%mcp.quarkus.otel.exporter.otlp.enabled=false

# Live evaluation (-Pevals, @TestProfile evals): real Langfuse Dev Services,
# every span exported (the AI_ONLY filter would drop the bare planning span).
%evals.quarkus.langfuse.devservices.enabled=true
%evals.quarkus.langfuse.devservices.shared=true
%evals.quarkus.langfuse.otel.span-filter=ALL
%evals.quarkus.otel.exporter.otlp.enabled=false
