# Evaluation samples for the trip planner (step 07).
#
# The parameters are the planner inputs, in planTrip order: destination,
# start date, days, travel style, travelers, budget, interests.
# The expected-output describes what an acceptable plan for that request must
# contain. The AI judge compares a real plan against it using rubric.txt; the
# invariant strategy only uses the parameters.
- name: "rome-family-three-days"
  parameters:
    - "Rome"
    - "2027-07-10"
    - "3"
    - "family"
    - "2"
    - "moderate"
    - "coastal towns"
  expected-output: >-
    A three-day family road trip starting in Rome in July for two travelers.
    The vehicle suits two people with luggage and is not a luxury or sports
    car. The itinerary has days 1 to 3, each with family-friendly activities,
    and includes at least one coastal town. The cost total is a euro amount
    that is reasonable for a moderate budget.
  tags:
    - "smoke"
    - "mcp"

- name: "barcelona-family-three-days"
  parameters:
    - "Barcelona"
    - "2027-07-12"
    - "3"
    - "family"
    - "2"
    - "moderate"
    - "beaches"
  expected-output: >-
    A three-day family road trip starting in Barcelona in July for two
    travelers. The vehicle suits two people with luggage and is not a luxury
    or sports car. The itinerary has days 1 to 3, each with family-friendly
    activities, and includes time at the beach. The cost total is a euro
    amount that is reasonable for a moderate budget.
  tags:
    - "smoke"
    - "mcp"

- name: "rome-family-seven-days"
  parameters:
    - "Rome"
    - "2027-07-10"
    - "7"
    - "family"
    - "2"
    - "moderate"
    - "historic sites"
  expected-output: >-
    A seven-day family road trip starting in Rome in July for two travelers.
    The vehicle suits two people with luggage and is not a luxury or sports
    car. The itinerary has days 1 to 7, includes historic sites, and leaves
    room for rest. The cost total is a euro amount that is reasonable for a
    moderate budget.
  tags:
    - "smoke"
