<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miles of Smiles - Trip Planner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; min-height: 100vh; }

        .app-header { background: #1a237e; color: white; padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem; }
        .app-header h1 { font-size: 1.25rem; font-weight: 500; }
        .app-header .logo { font-size: 1.5rem; }

        .page { display: none; height: calc(100vh - 56px); overflow-y: auto; }
        .page.active { display: block; }

        /* Form page */
        .form-page { display: none; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
        .form-page.active { display: flex; }
        .form-container { background: white; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 2rem; width: 100%; max-width: 520px; }
        .form-container h2 { font-size: 1.1rem; font-weight: 600; color: #333; margin-bottom: 1.25rem; text-transform: uppercase; letter-spacing: 0.5px; }

        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 500; color: #555; margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.3px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem; transition: border-color 0.2s; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #1a237e; }
        .form-group textarea { resize: vertical; min-height: 60px; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .btn-plan { width: 100%; padding: 0.75rem; background: #1a237e; color: white; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        .btn-plan:hover { background: #283593; }
        .btn-plan:disabled { background: #9e9e9e; cursor: not-allowed; }

        /* Results page */
        .results-page { padding: 2rem; }
        .results-content { max-width: 800px; margin: 0 auto; }

        .top-bar { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
        .btn-back { background: none; border: 1px solid #1a237e; color: #1a237e; border-radius: 6px; padding: 0.5rem 1rem; font-size: 0.85rem; cursor: pointer; transition: background 0.2s; white-space: nowrap; }
        .btn-back:hover { background: #e8eaf6; }

        .spinner { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6rem 2rem; color: #888; text-align: center; }
        .spinner .icon { font-size: 3rem; margin-bottom: 1rem; }
        .spinner p { font-size: 1.1rem; }
        .spinner .hint { font-size: 0.85rem; margin-top: 0.5rem; color: #aaa; }

        .status-banner { margin-bottom: 1rem; padding: 0.8rem 1rem; border-radius: 8px; font-size: 0.9rem; }
        .status-awaiting { background: #fff8e1; color: #8a6d00; border: 1px solid #ffe082; }
        .status-confirmed { background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; }
        .status-cancelled { background: #ffebee; color: #b71c1c; border: 1px solid #ef9a9a; }

        .action-bar { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; }
        .action-bar button { border: none; border-radius: 6px; padding: 0.65rem 1rem; font-size: 0.9rem; cursor: pointer; }
        .btn-approve { background: #2e7d32; color: white; }
        .btn-approve:hover { background: #1b5e20; }
        .btn-reject { background: #c62828; color: white; }
        .btn-reject:hover { background: #8e0000; }
        .action-bar button:disabled { background: #9e9e9e; cursor: not-allowed; }

        .plan-header { margin-bottom: 1.5rem; }
        .plan-header h2 { font-size: 1.4rem; color: #1a237e; }
        .plan-header .meta { color: #666; font-size: 0.85rem; margin-top: 0.25rem; }

        .plan-section { margin-bottom: 1.5rem; }
        .plan-section h3 { font-size: 1rem; color: #444; margin-bottom: 0.6rem; }
        .card { background: white; border-radius: 10px; padding: 1.25rem 1.5rem; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06); line-height: 1.6; font-size: 0.9rem; color: #333; margin-bottom: 0.5rem; }
        .card p { margin: 0.25rem 0; }
        .card ul { padding-left: 1.25rem; }
        .card ul li { margin-bottom: 0.3rem; }
        .day-card .day-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; }
        .day-card .day-num { background: #e8eaf6; color: #1a237e; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .day-card .overnight { margin-top: 0.4rem; font-size: 0.8rem; color: #666; }
        .costs-grid { display: flex; flex-direction: column; gap: 0.4rem; }
        .cost-item { display: flex; justify-content: space-between; padding: 0.3rem 0; border-bottom: 1px solid #f0f0f0; font-size: 0.85rem; }
        .cost-item:last-child { border-bottom: none; }
        .cost-item.total { font-weight: 600; border-top: 2px solid #1a237e; padding-top: 0.5rem; margin-top: 0.3rem; }
    </style>
</head>
<body>
<header class="app-header">
    <span class="logo">&#x1F697;</span>
    <h1>Miles of Smiles &mdash; Trip Planner</h1>
</header>

<!-- Page 1: Form -->
<div id="formPage" class="form-page active">
    <div class="form-container">
        <h2>Plan a New Trip</h2>
        <div class="form-group">
            <label>Destination</label>
            <input type="text" id="destination" placeholder="e.g. Italian Riviera, Swiss Alps, Provence">
        </div>
        <div class="form-group">
            <label>Start Date</label>
            <input type="date" id="startDate">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Duration (days)</label>
                <input type="number" id="days" value="7" min="1" max="30">
            </div>
            <div class="form-group">
                <label>Travelers</label>
                <input type="number" id="travelers" value="2" min="1" max="10">
            </div>
        </div>
        <div class="form-group">
            <label>Trip Type</label>
            <select id="tripType">
                <option value="family">Family Vacation</option>
                <option value="business">Business Travel</option>
                <option value="adventure">Adventure Trip</option>
                <option value="romantic">Romantic Getaway</option>
                <option value="roadtrip">Classic Road Trip</option>
            </select>
        </div>
        <div class="form-group">
            <label>Budget Range</label>
            <select id="budget">
                <option value="economy (€500-€1000)">Economy (&euro;500&ndash;&euro;1,000)</option>
                <option value="moderate (€1000-€2500)">Moderate (&euro;1,000&ndash;&euro;2,500)</option>
                <option value="comfortable (€2500-€5000)" selected>Comfortable (&euro;2,500&ndash;&euro;5,000)</option>
                <option value="luxury (€5000+)">Luxury (&euro;5,000+)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Additional Preferences</label>
            <textarea id="preferences" placeholder="e.g. We love wine tasting, prefer coastal routes, interested in history..."></textarea>
        </div>
        <button class="btn-plan" id="planBtn" onclick="planTrip()">Generate Trip Plan</button>
    </div>
</div>

<!-- Page 2: Results -->
<div id="resultsPage" class="results-page page">
    <div class="results-content" id="results"></div>
</div>

<script>
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    document.getElementById("startDate").value = tomorrow.toISOString().split("T")[0];

    let currentRequest = null;
    let currentInstanceId = null;
    let pollingHandle = null;

    function showPage(page) {
        document.getElementById("formPage").classList.remove("active");
        document.getElementById("resultsPage").classList.remove("active");
        document.getElementById(page).classList.add("active");
    }

    function goBackToForm() {
        stopPolling();
        showPage("formPage");
        document.getElementById("planBtn").disabled = false;
        document.getElementById("planBtn").textContent = "Generate Trip Plan";
    }

    async function planTrip() {
        const btn = document.getElementById("planBtn");
        btn.disabled = true;
        btn.textContent = "Planning...";

        currentRequest = {
            destination: document.getElementById("destination").value,
            startDate: document.getElementById("startDate").value,
            days: parseInt(document.getElementById("days").value, 10),
            tripType: document.getElementById("tripType").value,
            travelers: parseInt(document.getElementById("travelers").value, 10),
            budget: document.getElementById("budget").value,
            preferences: document.getElementById("preferences").value || "No specific preferences"
        };

        showPage("resultsPage");
        document.getElementById("results").innerHTML = `
            <div class="top-bar">
                <button class="btn-back" onclick="goBackToForm()">&#8592; Plan Another Trip</button>
            </div>
            <div class="spinner">
                <div class="icon">&#9203;</div>
                <p>Planning your trip...</p>
                <span class="hint">The agents are researching your destination, selecting a vehicle, and estimating costs</span>
            </div>
        `;

        try {
            const res = await fetch("/trip/plan", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(currentRequest)
            });
            if (!res.ok) throw new Error("Could not generate trip plan");
            const planStatus = await res.json();
            currentInstanceId = planStatus.instanceId;
            renderPlan(planStatus.plan, "awaiting_approval");
        } catch (e) {
            renderError(e.message);
        }
    }

    async function submitApproval(status) {
        if (!currentInstanceId) return;
        disableActionButtons(true);

        try {
            const res = await fetch("/trip/approve", {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    instanceId: currentInstanceId,
                    status: status,
                    feedback: ""
                })
            });
            if (!res.ok) throw new Error("Could not submit approval");

            if (status === "approved") {
                startPolling();
            } else {
                renderCancelled();
            }
        } catch (e) {
            renderError(e.message);
            disableActionButtons(false);
        }
    }

    function startPolling() {
        stopPolling();
        pollingHandle = setInterval(pollForConfirmation, 2000);
    }

    function stopPolling() {
        if (pollingHandle) { clearInterval(pollingHandle); pollingHandle = null; }
    }

    async function pollForConfirmation() {
        try {
            const res = await fetch(`/trip/plan/status?instanceId=${currentInstanceId}`);
            if (res.status === 204) return;
            if (!res.ok) return;
            const planStatus = await res.json();
            if (planStatus.status === "confirmed") {
                stopPolling();
                renderPlan(planStatus.plan, "confirmed", planStatus.confirmation);
            }
        } catch (e) {
            console.error(e);
        }
    }

    function renderPlan(plan, status, confirmation) {
        const v = plan.vehicle || {};
        const costs = plan.costs || {};
        const itinerary = plan.itinerary || [];
        const tips = plan.tips || [];
        const isAwaiting = status === "awaiting_approval";
        const isConfirmed = status === "confirmed";

        let banner = "";
        if (isAwaiting) {
            banner = `<div class="status-banner status-awaiting">The workflow is waiting for your decision.</div>`;
        } else if (isConfirmed) {
            const conf = confirmation || {};
            banner = `<div class="status-banner status-confirmed">Trip confirmed! Booking reference: <strong>${conf.bookingReference || "N/A"}</strong><br>${conf.message || ""}</div>`;
        }

        const actions = isAwaiting ? `
            <div class="action-bar">
                <button class="btn-approve" id="approveBtn" onclick="submitApproval('approved')">Approve Trip</button>
                <button class="btn-reject" id="rejectBtn" onclick="submitApproval('rejected')">Reject Trip</button>
            </div>` : "";

        document.getElementById("results").innerHTML = `
            <div class="top-bar">
                <button class="btn-back" onclick="goBackToForm()">&#8592; Plan Another Trip</button>
            </div>
            ${banner}
            ${actions}
            <div class="plan-header">
                <h2>${currentRequest.destination} &mdash; ${currentRequest.days}-Day ${capitalize(currentRequest.tripType)} Trip</h2>
                <div class="meta">${currentRequest.travelers} travelers &middot; ${currentRequest.budget}</div>
            </div>

            <div class="plan-section">
                <h3>&#x1F697; Vehicle Recommendation</h3>
                <div class="card">
                    <strong>${v.type || ""} &mdash; ${v.model || ""}</strong>
                    <p>${v.reasoning || ""}</p>
                </div>
            </div>

            <div class="plan-section">
                <h3>&#x1F5FA;&#xFE0F; Route Overview</h3>
                <div class="card"><p>${plan.routeOverview || ""}</p></div>
            </div>

            <div class="plan-section">
                <h3>&#x1F4C5; Daily Itinerary</h3>
                ${itinerary.map(day => `
                    <div class="card day-card">
                        <div class="day-header"><span class="day-num">Day ${day.day}</span> <strong>${day.title || ""}</strong></div>
                        <p>${day.description || ""}</p>
                        ${day.overnightStop ? `<div class="overnight">&#x1F3E8; ${day.overnightStop}</div>` : ""}
                    </div>
                `).join("")}
            </div>

            <div class="plan-section">
                <h3>&#x1F4B6; Estimated Costs</h3>
                <div class="card costs-grid">
                    ${costs.vehiclePerDay ? `<div class="cost-item"><span>Vehicle/day</span><span>${costs.vehiclePerDay}</span></div>` : ""}
                    ${costs.fuel ? `<div class="cost-item"><span>Fuel</span><span>${costs.fuel}</span></div>` : ""}
                    ${costs.tolls ? `<div class="cost-item"><span>Tolls</span><span>${costs.tolls}</span></div>` : ""}
                    ${costs.accommodation ? `<div class="cost-item"><span>Accommodation</span><span>${costs.accommodation}</span></div>` : ""}
                    ${costs.food ? `<div class="cost-item"><span>Food</span><span>${costs.food}</span></div>` : ""}
                    ${costs.activities ? `<div class="cost-item"><span>Activities</span><span>${costs.activities}</span></div>` : ""}
                    ${costs.total ? `<div class="cost-item total"><span>Total</span><span>${costs.total}</span></div>` : ""}
                </div>
            </div>

            ${tips.length ? `
                <div class="plan-section">
                    <h3>&#x1F4A1; Practical Tips</h3>
                    <div class="card"><ul>${tips.map(t => `<li>${t}</li>`).join("")}</ul></div>
                </div>` : ""}
        `;
    }

    function renderCancelled() {
        document.getElementById("results").innerHTML = `
            <div class="top-bar">
                <button class="btn-back" onclick="goBackToForm()">&#8592; Plan Another Trip</button>
            </div>
            <div class="status-banner status-cancelled">Trip rejected. The workflow ended without finalizing a booking.</div>
        `;
    }

    function renderError(message) {
        document.getElementById("results").innerHTML = `
            <div class="top-bar">
                <button class="btn-back" onclick="goBackToForm()">&#8592; Plan Another Trip</button>
            </div>
            <div class="spinner">
                <p>Error: ${message}</p>
            </div>
        `;
    }

    function disableActionButtons(disabled) {
        const approveBtn = document.getElementById("approveBtn");
        const rejectBtn = document.getElementById("rejectBtn");
        if (approveBtn) approveBtn.disabled = disabled;
        if (rejectBtn) rejectBtn.disabled = disabled;
    }

    function capitalize(s) {
        return s.charAt(0).toUpperCase() + s.slice(1);
    }
</script>
</body>
</html>
